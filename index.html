body{margin:0}[hidden]{display:none!important}

/* Layout: an X-style single feed column (600px) with a quiet right rail on desktop.
   Books are round accounts; saints and writers wear a halo ring. A verse page has Scripture replies and the Fathers in separate tabs. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --raised:#f9fafc; --line:#e0e4eb; --fg:#151922; --muted:#5b6474;
  --accent:#2b4a90; --accent-soft:#e5ebf7; --gold:#7d5e10; --danger:#b23a2b;
  --c-law:#8a5a2b; --c-history:#5f6f25; --c-poetry:#7a3d72; --c-prophets:#a13f2e; --c-gospels:#2b4a90; --c-letters:#2b6b66; --c-apoc:#4b3a8c;
  --on-cat:#ffffff;
  --f-verse:"EB Garamond",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1015; --surface:#141921; --raised:#19202a; --line:#262e3a; --fg:#e7eaf0; --muted:#98a1af;
  --accent:#93acea; --accent-soft:#1b2741; --gold:#d6b55c; --danger:#e9806f;
  --c-law:#d1a06e; --c-history:#b3c46e; --c-poetry:#d197c8; --c-prophets:#ec8f7c; --c-gospels:#93acea; --c-letters:#7fc6bf; --c-apoc:#ab9ce8;
  --on-cat:#0d1015; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1015; --surface:#141921; --raised:#19202a; --line:#262e3a; --fg:#e7eaf0; --muted:#98a1af;
  --accent:#93acea; --accent-soft:#1b2741; --gold:#d6b55c; --danger:#e9806f;
  --c-law:#d1a06e; --c-history:#b3c46e; --c-poetry:#d197c8; --c-prophets:#ec8f7c; --c-gospels:#93acea; --c-letters:#7fc6bf; --c-apoc:#ab9ce8;
  --on-cat:#0d1015; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:960px;margin:0 auto;display:grid;grid-template-columns:minmax(0,600px) 300px;gap:28px;justify-content:center}
@media (max-width:920px){.shell{grid-template-columns:minmax(0,600px)}.rail{display:none}}
main{min-width:0;background:var(--surface);border-inline:1px solid var(--line);min-height:100vh}
@media (max-width:640px){main{border-inline:0;margin-inline:-16px}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 2px 16px}
.logo{font-family:var(--f-verse);font-size:24px;font-weight:500;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.logo small{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hicons{display:flex;gap:2px}
.iconbtn{border:0;background:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--raised)}
.iconbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn.primary:hover{opacity:.9;background:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex}
.tab{flex:1;background:none;border:0;padding:12px 4px 10px;font-weight:600;color:var(--muted);position:relative}
.tab[aria-pressed="true"]{color:var(--fg);font-weight:800}
.tab[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:0;width:44px;height:3px;border-radius:3px;background:var(--accent);transform:translateX(-50%)}
.tab .n{font-weight:700;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.mixbar{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;font-size:12px;color:var(--muted);font-weight:600}
.mixbar input{flex:1 1 0;min-width:0;width:auto;accent-color:var(--accent)}
.mixbar output{flex:none;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}

/* avatars */
.av{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--cat,var(--muted));color:var(--on-cat);border:0;padding:0}
.av svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.av.sm{width:36px;height:36px}.av.sm svg{width:20px;height:20px}
.av.xs{width:28px;height:28px}.av.xs svg{width:16px;height:16px}
.av.lg{width:96px;height:96px}.av.lg svg{width:52px;height:52px;stroke-width:1.3}

/* posts */
.post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.post:hover{background:var(--raised)}
.post:focus-visible,.node.tap:focus-visible,.attached:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.notice .btn{margin-left:8px}
.post.just{background:color-mix(in srgb,var(--gold) 7%,var(--surface))}
.post .body{min-width:0;flex:1}
.who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;line-height:1.3}
.who b{font-weight:800}
.who .h,.who .t{color:var(--muted)}
.check{width:15px;height:15px;color:var(--accent);flex:none}
.verse{font-family:var(--f-verse);font-size:20px;line-height:1.42;margin:6px 0 4px;text-wrap:pretty;overflow-wrap:anywhere}
.verse sup{font-family:var(--f-ui);font-size:10px;font-weight:800;color:var(--muted);margin-right:2px}
.ref{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ref .tr{font-weight:600;letter-spacing:.06em}
.alt{font-size:12px;color:var(--muted);margin-top:2px}
.text{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.attached{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--raised);cursor:pointer}
.attached .verse{font-size:17px;margin:0 0 4px}
.meta{display:flex;align-items:center;gap:16px;margin-top:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.meta button,.meta .stat{background:none;border:0;padding:0;color:inherit;display:flex;align-items:center;gap:5px;font-weight:600;font-variant-numeric:tabular-nums}
.meta button{padding:8px;margin:-8px}
.meta button:hover{color:var(--accent)}
.meta .liked{color:var(--danger)}
.meta svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.meta .liked svg{fill:currentColor}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.new{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.chip.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.why{margin-left:auto}

textarea{width:100%;border:0;background:transparent;resize:vertical;min-height:52px;font:inherit;font-size:16px;color:var(--fg);padding:8px 0}
textarea::placeholder,input::placeholder{color:var(--muted)}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.crow .btn.primary{margin-left:auto}
.hint{font-size:12px;color:var(--muted)}
.hint.ok{color:var(--accent)}.hint.bad{color:var(--danger)}

/* thread */
.backbar{display:flex;align-items:center;gap:14px;padding:8px 12px 8px 16px}
.backbar .ttl{flex:1;min-width:0}
.backbar h1{font-size:17px;font-weight:800;line-height:25.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbar span{display:block;font-size:12px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{border:0;background:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.backbtn:hover{background:var(--raised)}
.backbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.focus{padding:16px 16px 4px}
.focus .verse{font-size:27px;line-height:1.35;margin:14px 0 8px}
.focus .text{font-size:18px}
.factions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 14px;border-bottom:1px solid var(--line)}
.factions .btn{display:flex;align-items:center;gap:6px}
.factions svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.factions .liked{color:var(--danger)}.factions .liked svg{fill:currentColor}
.ptabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 59.5px);z-index:4;background:var(--surface)}
.node{display:flex;gap:10px;padding:12px 16px 0}
.node.tap{cursor:pointer}
.node.tap:hover{background:var(--raised)}
.node .lcol{display:flex;flex-direction:column;align-items:center;flex:none}
.node .line{flex:1;width:2px;background:var(--line);margin-top:4px;min-height:12px}
.node .body{flex:1;min-width:0;padding-bottom:12px}
.node .meta{margin-top:6px}
.node .text{font-size:15px}
.node .verse{font-size:18px;margin:4px 0 2px}
.node .verse.sm{font-size:16px}
.node.big{padding-top:14px;border-bottom:1px solid var(--line)}
.node.big .text{font-size:19px;line-height:1.5}
.node.big .verse{font-size:24px}
.ancestors .node .body{padding-bottom:6px}
.branch{border-bottom:1px solid var(--line)}
.more{display:block;background:none;border:0;padding:0 16px 12px 62px;color:var(--accent);font-weight:700;font-size:13px;text-align:left}
.more:hover{text-decoration:underline}
.rto{font-size:13px;color:var(--muted);margin-top:1px}
.rto b{color:var(--accent);font-weight:700}
.earlier{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 16px;text-align:left;color:var(--accent);font-weight:700;font-size:13px}

    if(liked.length&&r<0.22){const b=BK[liked[Math.floor(rnd()*liked.length)]];g=b.start+Math.floor(rnd()*b.n);why=M.me.following['b:'+b.code]?'You follow '+b.name:'Because you liked '+b.name}

  let av=0,aq=0;
  while(v.length||q.length){
    av+=wv;aq+=wq;
    const pick=[['v',av,v],['q',aq,q]].filter(p=>p[2].length).sort((a,b)=>b[1]-a[1])[0];
    out.push(pick[2].shift());
    if(pick[0]==='v')av-=1;else aq-=1;
  }
  return out;
}
function followingFeed(){
  const f=Object.keys(M.me.following),out=[];
  const books=f.filter(k=>k.startsWith('b:')).map(k=>BK[k.slice(2)]).filter(Boolean);
  const saints=new Set(f.filter(k=>k.startsWith('s:')).map(k=>k.slice(2)));
  const day=todayKey();
  books.forEach(b=>{for(let i=0;i<3;i++){const g=b.start+Math.floor(hash(b.code+day+i)*b.n);if(T(g).length>=35)out.push({kind:'v',x:{g,why:'You follow '+b.name},h:hash('v'+g+day)})}});
  QUOTES.filter(q=>saints.has(q.s)).forEach(q=>out.push({kind:'q',x:{i:q.i,why:'You follow '+(ACC[q.s]||{}).n},h:hash('q'+q.i+day)}));
  if(FAUTH)f.filter(k=>k.startsWith('a:')||k.startsWith('s:')).forEach(k=>{const a=ACC[k.slice(2)];if(!a)return;
    const vs=[...new Set(acctKeys(a.id).flatMap(x=>FAUTH[x]||[]))];
    for(let i=0;i<Math.min(3,vs.length);i++){const g=vs[Math.floor(hash(a.id+day+i)*vs.length)];out.push({kind:'v',x:{g,why:'You follow '+a.n,ptabgo:'fathers',ffocus:a.id},h:hash('v'+g+day+a.id)})}});
  return out.sort((a,b)=>a.h-b.h).slice(0,60);
}

const SRC_LABEL={catena:'Catena Aurea',hcf:'Fathers',haydock:'Haydock',challoner:'Challoner'};
function longText(id,text){

function fathersList(g){
  const b=bookOf(g),F=FCACHE[b.code];
  const qs=QBYG[g]||[];
  if(!F){loadFathers(b.code).then(()=>softRender());return `<div class="writing"><span class="dots"><i></i><i></i><i></i></span><span>Gathering the Fathers…</span></div>`}
  let items=(F[g]||[]).map((it,i)=>({src:it[0],acc:authorAcc(it[1]),text:it[2],cite:it[3],url:it[4],end:it[5],id:`f:${g}:${i}`})).filter(x=>x.acc&&x.acc.k!=='exclude');
  const ord=x=>x.src==='haydock'?9000:x.src==='challoner'?9100:(x.acc.sort||5000);
  items.sort((a,c)=>ord(a)-ord(c));
  const quoteItems=qs.map(q=>({src:'saint',acc:ACC[q.s],text:q.t,cite:quoteSrc(q),url:'',end:0,id:'q'+q.i,q}));
  let all=[...quoteItems,...items];
  const f=V.ffocus?'all':S.ffilt;
  if(f==='fathers')all=all.filter(x=>x.src==='catena'||x.src==='hcf'||x.src==='saint');
  else if(f==='haydock')all=all.filter(x=>x.src==='haydock');
  else if(f==='challoner')all=all.filter(x=>x.src==='challoner');
  const filts=[['all','All'],['fathers','Fathers & saints'],['haydock','Haydock'],['challoner','Challoner']];
  const head=`<div class="sortbar"><span>${all.length} ${all.length===1?'voice':'voices'} on this verse</span><div class="seg" role="group" aria-label="Filter">${filts.map(([k,l])=>`<button data-ffilt="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div></div>`;
  if(!all.length)return head+`<div class="empty"><b>No commentary on this verse yet</b>Haydock and Challoner annotate many verses, and the Fathers concentrate on the Gospels, Psalms, Paul and Job.</div>`;
  if(V.ffocus){const i=all.findIndex(x=>x.id===V.ffocus||(x.acc&&x.acc.id===V.ffocus));if(i>=(V.fmore||15))V.fmore=i+1}
  const shown=all.slice(0,V.fmore||15);
  return head+shown.map(x=>{
    const a=x.acc,yrs=a.y?`<span class="t">· ${esc(a.y)}</span>`:'';
    const kindTag=a.kind==='saint'||a.kind==='blessed'?'':`<span class="kindchip">${esc(a.k==='writer'?'Church writer':a.k==='compilation'?'Compilation':a.k==='pseudonymous'?'Attributed':a.k==='commentary'?'Commentary':a.k==='council'?'Council':'')}</span>`;
    const via=x.src==='catena'?' · via the Catena Aurea of St. Thomas Aquinas':'';
    const hl=V.ffocus&&(x.id===V.ffocus||a.id===V.ffocus);
    return `<div class="branch"><div class="node${hl?' hl':''}"${hl?' id="ffocus"':''}>
      <div class="lcol">${accAv(a,'sm')}</div>
      <div class="body">
        <div class="who">${accWho(a,yrs)} ${kindTag}</div>
        <div class="rto">On <b>${esc(rangeLabel(g,x.end||g))}</b>${via}</div>
        ${longText(x.id,x.text)}
        <div class="src">${x.src==='saint'?x.cite:esc(x.cite)}${/^https?:\/\//.test(x.url||'')?` · <a href="${esc(x.url)}" target="_blank" rel="noopener">Source</a>`:''}</div>
        <div class="meta">${x.q?`<a class="stat" href="#" data-quote="${x.q.i}">Open quote</a>`:''}${likeBtn(x.id)}${markBtn(x.id)}<button data-img="${esc(x.id)}" aria-label="Save as image">${svg(I.image)}</button></div>
      </div></div></div>`;
  }).join('')+(all.length>shown.length?`<button class="earlier" data-fmore="1">Show ${Math.min(15,all.length-shown.length)} more of ${all.length}</button>`:'')+
  `<div class="credit">Public-domain sources: the Catena Aurea of St. Thomas Aquinas (Oxford translation, 1841–45); 19th-century translations of the Fathers (Ante-Nicene and Nicene and Post-Nicene Fathers, Library of the Fathers), kept only where the words were found in the cited text; Haydock's Catholic Bible Commentary (1859); Bishop Challoner's notes (1749–52). <button class="linkbtn" data-go="credits">All sources</button></div>`;
}

/* ---- Saint / author profile ---- */
function acctKeys(id){if(id.startsWith('raw:'))return [id.slice(4)];return Object.entries(AUTH).filter(([k,a])=>a.acc===id).map(([k])=>k).concat(id==='haydock'?['haydock']:id==='challoner'?['challoner']:[])}
function feastLabel(s){if(!s.f)return '';const [m,d]=s.f.split('-').map(Number);return new Date(2001,m-1,d).toLocaleDateString(LOC,{month:'long',day:'numeric'})}
function renderAcct(){
  const a=ACC[V.id];if(!a){V={name:'feed'};return render()}
  const tab=V.atab||'posts',qs=QUOTES.filter(q=>q.s===a.id);
  const keys=acctKeys(a.id),verses=FAUTH?[...new Set(keys.flatMap(k=>FAUTH[k]||[]))].sort((x,y)=>x-y):null;
  const fid=(a.kind==='saint'||a.kind==='blessed'?'s:':'a:')+a.id,following=!!M.me.following[fid];
  const kindLabel=a.kind==='saint'?'Saint':a.kind==='blessed'?'Blessed':a.k==='writer'?'Church writer (not canonized)':a.k==='compilation'?'Medieval compilation':a.k==='commentary'?'Catholic commentary':a.k==='pseudonymous'?'Attributed writings':a.k==='council'?'Council':'';
  let body='';
  if(tab==='posts')body=qs.length?qs.map(q=>quoteCard({i:q.i,why:''})).join(''):`<div class="empty"><b>No quotations yet</b>${verses&&verses.length?'See this account\'s commentary on Scripture in the Commentary tab.':'We only post words found in public-domain editions of a saint\'s own writings.'}</div>`;
  else if(tab==='commentary'){
    if(verses==null)body=`<div class="writing"><span class="dots"><i></i><i></i><i></i></span><span>Loading…</span></div>`;
    else if(!verses.length)body='<div class="empty">No verse commentary from this account in our sources.</div>';
    else body=`<div class="sortbar"><span>Comments on ${verses.length.toLocaleString(LOC)} verses</span></div>`+verses.slice(0,V.cmore||30).map(g=>`<button class="res" data-verse="${g}" data-ptabgo="fathers" data-ffocus="${esc(a.id)}">${bookAv(bookOf(g).code,'sm',true)}<div class="body"><b>${refLabel(g)}</b><div class="verse">${esc(trunc(T(g),160))}</div></div></button>`).join('')+(verses.length>(V.cmore||30)?`<button class="earlier" data-cmore="1">Show more</button>`:'');
  }else{
    const works=[...new Map(qs.map(q=>[q.w+'|'+q.tr,q])).values()];
    body=`<div class="section"><h3>About</h3><p class="text">${esc(a.bio||'')}</p>${/^https?:\/\//.test(a.w||'')?`<p class="src"><a href="${esc(a.w)}" target="_blank" rel="noopener">Read more on Wikipedia</a></p>`:''}</div>`+
      (works.length?`<div class="section"><h3>Writings quoted here</h3>${works.map(q=>`<p class="src" style="font-size:14px">${esc(q.w)}${q.tr?`, translated by ${esc(q.tr)}`:''}${q.y?` (${esc(q.y)})`:''}</p>`).join('')}</div>`:'')+
      `<div class="credit">Profiles are built from the General Roman Calendar (romcal, MIT), the Roman Martyrology (1908, public domain) and other public sources, checked by reviewers. Quotations are word-for-word from public-domain translations.</div>`;
  }
  $('#main').innerHTML=topBar(esc(a.n),kindLabel)+`
    <div class="banner" style="--cat:var(--t-${a.t||'writer'})"></div>
    <div class="prof">
      <div style="display:flex;justify-content:space-between;align-items:flex-end">${accAv(a,'lg',true)}<button class="follow" data-follow="${esc(fid)}" aria-pressed="${following}">${following?'Following':'Follow'}</button></div>
      <h2>${esc(a.n)} ${a.kind==='saint'?HALO('Saint'):a.kind==='blessed'?HALO('Blessed'):''}</h2><div class="h">@${esc(a.h)} · ${esc(kindLabel)}</div>
      ${a.bio?`<p>${esc(a.bio)}</p>`:''}
      <div class="facts">${a.f?`<span>Feast <b>${esc(feastLabel(a))}</b>${a.grc?' · General Roman Calendar':''}</span>`:''}${a.b||a.d?`<span>${esc(a.b||'?')}–${esc(a.d||'?')}</span>`:a.y?`<span>${esc(a.y)}</span>`:''}${a.r?`<span>${esc(a.r)}</span>`:''}${TYPES[a.t]?`<span>${esc(TYPES[a.t])}</span>`:''}</div>
      ${a.p&&a.p.length?`<div class="patrons">${a.p.map(x=>`<span class="chip">Patron of ${esc(x)}</span>`).join('')}</div>`:''}
    </div>

    ${body}`;
}

/* ---- Book profile ---- */
function talksWith(b){
  if(!XR)return null;if(b._talks)return b._talks;const cnt={};
  for(let g=b.start;g<b.start+b.n;g++){const s=XR[g];if(!s)continue;for(const p of s.split(';')){const t=+p.slice(0,p.indexOf(','));const c=bookOf(t).code;if(c!==b.code)cnt[c]=(cnt[c]||0)+1}}
  return b._talks=Object.entries(cnt).sort((a,c)=>c[1]-a[1]).slice(0,5);
}
function bookPosts(b,page){const out=[],seen=new Set();let i=0;while(out.length<(page+1)*8&&i<400){const g=b.start+Math.floor(hash(b.code+':'+i)*b.n);i++;if(seen.has(g)||T(g).length<35)continue;seen.add(g);out.push(g)}return out}
function renderBook(){
  const b=BK[V.code],tab=V.btab||'posts',tw=talksWith(b),fid='b:'+b.code,following=!!M.me.following[fid];
  let pin='';

  const posts=tab==='posts'?bookPosts(b,V.page||0).map(g=>verseCard({g,why:''})).join('')+`<button class="earlier" data-bookmore="1">Show more from ${esc(b.name)}</button>`:
    `<div class="chgrid">${b.ch.map((_,i)=>`<button data-read="${b.code}" data-c="${i+1}" aria-label="Chapter ${i+1}">${i+1}</button>`).join('')}</div>`;
  $('#main').innerHTML=topBar(esc(b.name),`${b.n.toLocaleString(LOC)} verses`)+`
    <div class="banner" style="--cat:var(--c-${b.cat})"></div>
    <div class="prof">
      <div style="display:flex;justify-content:space-between;align-items:flex-end"><div class="av lg" style="--cat:var(--c-${b.cat})">${svg(b.icon)}</div><button class="follow" data-follow="${fid}" aria-pressed="${following}">${following?'Following':'Follow'}</button></div>
      <h2>${esc(b.name)} ${CHECK}</h2><div class="h">@${b.handle}</div>
      ${b.dr!==b.name?`<div class="dr">In the Douay-Rheims: ${esc(b.dr)}</div>`:''}
      ${b.bio?`<p>${esc(b.bio)}</p>`:''}
      <div class="facts"><span><b>${b.ch.length}</b> chapters</span><span><b>${b.n.toLocaleString(LOC)}</b> verses</span><span>${b.t==='OT'?'Old':'New'} Testament</span><span>${esc(CATS[b.cat])}</span>${b.deut?'<span>Deuterocanonical</span>':''}</div>
      ${tw&&tw.length?`<div class="talks">Talks most with ${tw.map(([c])=>`<button data-book="${c}">${bookAv(c,'xs',true)}${esc(BK[c].name)}</button>`).join('')}</div>`:''}
    </div>
    <nav class="ptabs" aria-label="Book"><button class="tab" aria-pressed="${tab==='posts'}" data-btab="posts">Posts</button><button class="tab" aria-pressed="${tab==='chapters'}" data-btab="chapters">Chapters</button></nav>
    ${tab==='posts'?pin:''}${posts}`;
}

/* ---- Chapter reader ---- */
function renderChapter(){
  const b=BK[V.code],c=V.c;
  if(!b||!b.ch[c-1]){$('#main').innerHTML=topBar('Not found','')+`<div class="empty"><b>That chapter is not in the Douay-Rheims</b>${b?`${esc(b.name)} has ${b.ch.length} chapters.`:''}</div>`;return}
  const n=b.ch[c-1],start=b.start+b.cum[c-1],key=`c${b.code}${c}`;
  let rows='';
  for(let v=1;v<=n;v++){const g=start+v-1;const xc=xcount(g);rows+=`<button class="rv ${V.hl===g?'hl':''}" data-verse="${g}" id="rv${g}"><sup>${v}</sup>${esc(T(g))}${xc?`<span class="xc">${xc} links</span>`:''}</button>`}
  const prev=c>1?`<button class="btn" data-read="${b.code}" data-c="${c-1}">← Chapter ${c-1}</button>`:'<span></span>';
  const next=c<b.ch.length?`<button class="btn" data-read="${b.code}" data-c="${c+1}">Chapter ${c+1} →</button>`:'<span></span>';
  $('#main').innerHTML=topBar(`${esc(bname(b))} ${c}`,`${esc(b.name)} · ${n} verses`)+
    `<div class="factions" style="padding:10px 16px"><button class="btn ${speaking===key?'on':''}" data-speak="${key}">${svg(speaking===key?I.stop:I.speak)}${speaking===key?'Stop':'Listen to this chapter'}</button></div>`+
    `<div class="reader">${rows}</div><div class="chnav">${prev}${next}</div>`;
}

/* ---- Today ---- */
const CALS={GRC:'General Roman',US:'United States',CA:'Canada'};
/* a national calendar only lists the days that differ from the General Roman Calendar */
function calDay(k){
  const base=CAL&&CAL.days[k];if(S.cal==='GRC'||!base)return base;
  const nat=NATCAL[S.cal];if(!nat)return base;
  const d=nat.days[k];return d?Object.assign({},base,d):base;
}
function calRange(){const ks=CAL?Object.keys(CAL.days).sort():[];if(!ks.length)return '';const f=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString(LOC,{month:'long',year:'numeric'})};return f(ks[0])+' to '+f(ks[ks.length-1])}
function calPicker(){
  if(!CAL)return '';
  const st=S.cal!=='GRC'&&!NATCAL[S.cal]?(NATCAL_ERR[S.cal]?' <span class="hint bad">could not be loaded</span>':' <span class="hint">loading…</span>'):'';
  return `<div class="mixrow" style="padding:10px 0 0"><span>Calendar</span><div class="seg calseg" role="group" aria-label="Calendar">${Object.entries(CALS).map(([c,l])=>`<button data-calsel="${c}" aria-pressed="${S.cal===c}">${esc(l)}</button>`).join('')}</div>${st}</div>`;
}
const PLAN_CH=()=>{if(PLAN_CH.list)return PLAN_CH.list;const l=[];BOOKS.forEach(b=>b.ch.forEach((_,i)=>l.push([b.code,i+1])));return PLAN_CH.list=l};
function planDay(n){const L=PLAN_CH(),N=L.length;return L.slice(Math.floor((n-1)*N/365),Math.floor(n*N/365))}
function planDayFor(k){const p=M.me.plan;if(!p||!p.start)return 0;const [y,m,d]=p.start.split('-').map(Number),[y2,m2,d2]=k.split('-').map(Number);const n=Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y,m-1,d))/864e5)+1;return n>=1&&n<=365?n:(n>365?365:0)}
function readingText(rd){
  if(!rd.g||!rd.g.length)return '';
  let out='',total=0,next=null;
  for(const [a,e] of rd.g){for(let i=a;i<=e;i++){if(total>=60){next=i;break}out+=`<sup>${VC[i]}:${VV[i]}</sup>${esc(T(i))} `;total++}if(next!=null)break}
  if(next!=null){const b=bookOf(next);out+=`… <button class="showmore" data-read="${b.code}" data-c="${VC[next]}" data-hl="${next}">Continue at ${refLabel(next)}</button>`}
  return out;
}
function renderToday(){
  const k=V.date||todayKey(),day=calDay(k),md=mmdd(k),pc=principal(day);
  const ss=saintsOn(md),mart=(MART&&MART.days[md])||[];
  const [y,m,d]=k.split('-').map(Number);
  const shift=n=>{const dt=new Date(y,m-1,d+n);return todayKey(dt)};
  let h=`<div class="section"><div class="today" style="margin:0;cursor:default"><div class="body">
    <div class="d"><span class="litdot" role="img" aria-label="Liturgical colour: ${esc((pc&&pc.col)||'not given')}" title="Liturgical colour: ${esc((pc&&pc.col)||'not given')}" style="--lit:${litColor(pc&&pc.col)}"></span>${esc(prettyDate(k))}</div>
    <div class="n">${esc(pc?pc.n:'')}</div>
    ${day?`<div class="hint">${esc([day.w||day.s,day.sc?`Sunday cycle ${day.sc}`:'',day.wc?`Weekday cycle ${day.wc}`:''].filter(Boolean).join(' · '))}</div>`:CAL?`<div class="hint">The liturgical calendar here covers ${esc(calRange())}.</div>`:'<div class="hint">Loading the calendar…</div>'}
    ${day&&day.c&&day.c.length>1?`<div class="hint">Also: ${day.c.filter(c=>c!==pc).map(c=>esc(c.n)+(c.r?` (${esc(c.r)})`:'')).join('; ')}</div>`:''}
    </div></div>
    ${calPicker()}
    <div class="chnav" style="border:0;padding:10px 0 0"><button class="btn" id="day-prev" data-day="${shift(-1)}">← Previous day</button>${k!==todayKey()?`<button class="btn" id="day-today" data-day="${todayKey()}">Today</button>`:''}<button class="btn" id="day-next" data-day="${shift(1)}">Next day →</button></div></div>`;
  if(day&&day.rd&&day.rd.length){
    h+=`<div class="section"><h3>Readings of the day</h3>${day.rd.map(r=>`<div class="reading"><div class="lbl">${esc(r.l)}</div>
      <div class="rref"><span>${esc(r.ref)}</span>${r.g&&r.g.length?`<a class="vref" href="#" data-g="${r.g[0][0]}">${esc(rangeLabel(r.g[0][0],r.g[r.g.length-1][1]))} in the Douay-Rheims</a>`:''}</div>
      <div class="rtext">${readingText(r)||'<span class="hint">This reading could not be matched to the Douay-Rheims text.</span>'}</div></div>`).join('')}
      <p class="credit" style="padding:8px 0 0">Reading references from the Roman Lectionary, checked against the Ordo Lectionum Missae (1981); text from the Douay-Rheims, so wording and some verse numbers differ from the Mass readings in your parish. <button class="linkbtn" data-go="credits">Sources</button></p></div>`;
  }else if(day)h+=`<div class="section"><h3>Readings of the day</h3><p class="hint">We could not confirm the readings for this day from our sources, so none are shown.</p></div>`;
  h+=`<div class="section"><h3>Saints of the day</h3>${ss.length?ss.slice(0,V.smore||12).map(s=>`<button class="bookrow" data-acct="${esc(s.id)}">${accAv(s,'sm',true)}<div><b>${esc(s.n)}</b><span>${s.grc?'General Roman Calendar · ':''}${esc(s.bio||'')}</span></div></button>`).join('')+(ss.length>(V.smore||12)?`<button class="earlier" data-smore="1">Show all ${ss.length}</button>`:''):'<p class="hint">No saint in our list has a feast on this date.</p>'}</div>`;
  if(mart.length)h+=`<div class="section"><h3>The Roman Martyrology</h3><p class="hint" style="margin-top:0">Saints commemorated on this day in the traditional Roman Martyrology (1908 English translation, public domain).</p>${mart.slice(0,V.mmore?999:3).map(t=>`<p class="mart">${esc(t)}</p>`).join('')}${mart.length>3&&!V.mmore?`<button class="showmore" data-mmore="1">Read all ${mart.length} entries</button>`:''}</div>`;
  const pd=planDayFor(k);
  if(M.me.plan&&M.me.plan.start){
    const doneN=Object.keys(M.me.plan.done||{}).length,chs=pd?planDay(pd):[];
    h+=`<div class="section"><h3>Bible in a year · Day ${pd||'–'}</h3><div class="progress"><i style="width:${Math.round(doneN/365*100)}%"></i></div><p class="hint">${doneN} of 365 days read</p>
      ${chs.map(([c,ch])=>`<button class="btn" style="margin:4px 6px 0 0" data-read="${c}" data-c="${ch}">${esc(bname(BK[c]))} ${ch}</button>`).join('')}
      ${pd?`<div style="margin-top:10px"><button class="btn ${M.me.plan.done&&M.me.plan.done[pd]?'on':'primary'}" data-plandone="${pd}">${M.me.plan.done&&M.me.plan.done[pd]?'Read ✓':'Mark day '+pd+' as read'}</button></div>`:''}</div>`;
  }else h+=`<div class="section"><h3>Bible in a year</h3><p class="hint">All 73 books in 365 days, about four chapters a day.</p><button class="btn primary" data-planstart="1">Start today</button></div>`;
  $('#main').innerHTML=topBar('Today',esc(prettyDate(k)))+h;
}

/* ---- Me ---- */

  if(/^q/.test(id)&&QBY[id.slice(1)])return quoteCard({i:id.slice(1),why:''});
  const m=/^f:(\d+):(\d+)$/.exec(id);if(m)return `<button class="res" data-verse="${m[1]}" data-ptabgo="fathers"><div class="body"><b>Commentary on ${refLabel(+m[1])}</b><div class="hint">Saved from the Fathers tab</div></div></button>`;
  return '';
}

function renderSearch(){
  $('#main').innerHTML=topBar('Search','Verses, books, saints and their words')+
    `<form class="searchbox" id="searchform"><input id="q" type="search" placeholder="John 3:16, Psalm 22, Augustine, or a phrase" value="${esc(V.q||'')}" autocomplete="off" aria-label="Search"><button class="btn primary" type="submit">Go</button></form><div id="results"></div>`;
  searchResults();const q=$('#q');if(q&&!V.q)q.focus();

const plain=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function searchResults(){
  const box=$('#results');if(!box)return;
  const q=(V.q||'').trim();
  if(!q){box.innerHTML=`<div class="sect">Try</div>${['John 1:1','Psalm 22','Augustine','Thérèse','charity','shepherd'].map(s=>`<button class="res" data-q="${esc(s)}"><div class="body"><b>${esc(s)}</b></div></button>`).join('')}`;return}
  let out='';const r=parseRef(q);
  if(r){
    const b=BK[r.code];
    if(r.g>=0&&r.v)out+=`<div class="sect">Verse</div><button class="res" data-verse="${r.g}">${bookAv(b.code,'sm',true)}<div class="body"><b>${refLabel(r.g)}</b><div class="verse">${esc(T(r.g))}</div></div></button>`;
    else if(r.v)out+=`<div class="notice">${esc(b.name)} ${r.c}:${r.v} is not in the Douay-Rheims. ${b.code==='PSA'?'Psalm numbers here follow the Vulgate, usually one lower than Hebrew numbering.':''}</div>`;
    else if(r.c&&!r.bad)out+=`<div class="sect">Chapter</div><button class="res" data-read="${b.code}" data-c="${r.c}"><div class="body"><b>Read ${esc(bname(b))} ${r.c}</b><div class="hint">${b.ch[r.c-1]} verses</div></div></button>`;
    out+=`<div class="sect">Book</div><button class="bookrow" data-book="${b.code}">${bookAv(b.code,'sm',true)}<div><b>${esc(b.name)}</b><span>@${b.handle} · ${b.ch.length} chapters</span></div></button>`;
  }
  const pq=plain(q);
  let ss=[];
  if(pq.length>=3){
    ss=PEOPLE().filter(s=>plain(s.n).includes(pq)||plain(s.h).includes(pq.replace(/\s/g,''))).slice(0,12);
    if(ss.length)out+=`<div class="sect">Saints and writers</div>`+ss.map(s=>`<button class="bookrow" data-acct="${esc(s.id)}">${accAv(s,'sm',true)}<div><b>${esc(s.n)}</b><span>${s.f?esc(feastLabel(s))+' · ':''}${esc(s.bio||'')}</span></div></button>`).join('');
  }
  const words=q.toLowerCase().split(/\s+/).filter(w=>w.length>=3);
  if(r&&r.c&&r.bad&&!r.v){const b=BK[r.code];out=`<div class="notice">${esc(bname(b))} ${r.c} is not in the Douay-Rheims. ${esc(b.name)} has ${b.ch.length} chapters.</div>`+out}
  if(words.length&&!(r&&(r.v||r.c))){
    const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
    const qh=QUOTES.filter(x=>words.every(w=>x.t.toLowerCase().includes(w))).slice(0,15);
    if(qh.length)out+=`<div class="sect">Words of the saints</div>`+qh.map(x=>`<button class="res" data-quote="${x.i}">${accAv(ACC[x.s],'sm',true)}<div class="body"><b>${esc((ACC[x.s]||{}).n||'')}</b><div class="verse">${esc(trunc(x.t,240)).replace(re,'<mark>$1</mark>')}</div></div></button>`).join('');
    const hits=[];
    for(let g=0;g<TOTAL&&hits.length<40;g++){const t=T(g).toLowerCase();if(words.every(w=>t.includes(w)))hits.push(g)}
    if(hits.length)out+=`<div class="sect">${hits.length>=40?'First 40 verses':hits.length+' verses'} containing “${esc(words.join(' '))}”</div>`+hits.map(g=>`<button class="res" data-verse="${g}"><div class="body"><b>${refLabel(g)}</b><div class="verse">${esc(T(g)).replace(re,'<mark>$1</mark>')}</div></div></button>`).join('');
    else if(!r&&!qh.length&&!ss.length)out+='<div class="empty">Nothing found. The Douay-Rheims uses older forms like "charity", "Isaias" or "Noe".</div>';
  }
  box.innerHTML=out;
}

/* ================= Files: images and backups =================
   On claude.ai files are saved through the page's download permission; elsewhere the phone's share sheet or a normal download. */
/* inside the Android app (window.S73Native) files go to the gallery (images) or Downloads (backups) */
const NATIVE=window.S73Native||null;
const blobB64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(blob)});
async function saveFile(blob,filename){
  if(NATIVE){const where=NATIVE.saveFile(filename,blob.type||'application/octet-stream',await blobB64(blob));if(!where)throw new Error('not saved');toast('Saved to '+where);return false}
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;
  if(dl){try{await dl.save({filename,data:blob});return true}catch(e){if(e&&e.code==='declined')return false;throw e}}
  const file=typeof File==='function'?new File([blob],filename,{type:blob.type}):null;
  if(file&&navigator.canShare&&/image/.test(blob.type)&&matchMedia('(pointer:coarse)').matches&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return true}catch(e){if(e&&e.name==='AbortError')return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true;
}

/* ================= Offline (installed version only) ================= */
const PWA=!!window.S73_PWA;
const OFFLINE={on:false,have:0,total:0,mb:0,busy:false,info:null};
async function offlineCheck(){
  if(!PWA||!('caches' in window))return;
  OFFLINE.on=true;
  try{
    const info=OFFLINE.info||(OFFLINE.info=await getJSON('data/offline.json'));
    const codes=Object.keys(info.fathers);let have=0,left=0;
    for(const c of codes){if(await caches.match(`data/fathers/${c}.json`,{ignoreSearch:true}))have++;else left+=info.fathers[c]}
    OFFLINE.have=have;OFFLINE.total=codes.length;OFFLINE.mb=Math.max(1,Math.round(left/1e6));
  }catch(e){}
  if(V.name==='me')softRender();
}
async function saveAllOffline(){
  if(OFFLINE.busy||!OFFLINE.info)return;OFFLINE.busy=true;render();
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  let failed=0;
  try{
    const cache=await caches.open(OFFLINE.info.fcache);
    const todo=[];for(const c of Object.keys(OFFLINE.info.fathers))if(!(await caches.match(`data/fathers/${c}.json`,{ignoreSearch:true})))todo.push(c);
    const worker=async()=>{while(todo.length){const c=todo.shift();const url=`data/fathers/${c}.json`;
      try{const r=await fetch(url,{cache:'no-cache'});if(!r.ok)throw 0;await cache.put(url,r);OFFLINE.have++;if(V.name==='me'&&!inField())render()}catch(e){failed++}}};
    await Promise.all([worker(),worker(),worker()]);
  }catch(e){failed++}
  OFFLINE.busy=false;await offlineCheck();render();
  toast(failed?'Some books could not be saved. Check your connection and try again.':'All commentary is saved for offline use');
}
function startOffline(){
  if(!PWA||!('serviceWorker' in navigator))return;
  const hadController=!!navigator.serviceWorker.controller;let told=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(told||!hadController)return;told=true;toast('Updated. The new version opens next time.')});
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(offlineCheck).catch(()=>{});
}

function loadNat(c){
  if(!c||c==='GRC'||NATCAL[c]||NATLOAD[c])return;
  NATLOAD[c]=getJSON(`data/calendar_${c}.json`).then(d=>{NATCAL[c]=d;softRender()}).catch(()=>{NATCAL_ERR[c]=true;delete NATLOAD[c];softRender()});
}

/* ================= Images and reading aloud ================= */
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function wrapLines(ctx,text,width){const words=text.split(/\s+/),lines=[];let line='';words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>width&&line){lines.push(line);line=w}else line=t});if(line)lines.push(line);return lines}
function imageFor(id){
  if(/^v\d+$/.test(id)){const g=+id.slice(1);return {text:T(g),ref:refLabel(g)+' · Douay-Rheims',by:bookOf(g).name,file:refLabel(g)}}
  if(/^q/.test(id)&&QBY[id.slice(1)]){const q=QBY[id.slice(1)],a=ACC[q.s];return {text:q.t,ref:q.w+(q.l?', '+q.l:''),by:a?a.n:'',file:(a?a.h:'quote')}}
  const m=/^f:(\d+):(\d+)$/.exec(id);if(m){const g=+m[1],F=FCACHE[bookOf(g).code]||{},it=(F[g]||[])[+m[2]];if(it){const a=authorAcc(it[1]);return {text:trunc(it[2],700),ref:'On '+refLabel(g),by:a?a.n:'',file:(a?a.h:'commentary')+' '+refLabel(g)}}}
  return null;
}
async function saveImage(id){
  const d=imageFor(id);if(!d)return;
  try{await document.fonts.load('48px "EB Garamond"')}catch(e){}
  const W=1080,Hh=1350,c=document.createElement('canvas');c.width=W;c.height=Hh;const x=c.getContext('2d');
  const bg=cssVar('--surface')||'#fff',fg=cssVar('--fg')||'#151922',mu=cssVar('--muted')||'#5b6474',ac=cssVar('--gold')||'#7d5e10';
  x.fillStyle=bg;x.fillRect(0,0,W,Hh);x.fillStyle=ac;x.fillRect(90,140,8,120);
  let size=58;x.font=`${size}px "EB Garamond", Georgia, serif`;let lines=wrapLines(x,d.text,W-200);
  while(lines.length*size*1.32>820&&size>30){size-=4;x.font=`${size}px "EB Garamond", Georgia, serif`;lines=wrapLines(x,d.text,W-200)}
  x.fillStyle=fg;let y=Math.max(200,(Hh-lines.length*size*1.32)/2-60);lines.forEach(l=>{x.fillText(l,110,y);y+=size*1.32});
  x.font='700 30px Manrope, system-ui, sans-serif';x.fillStyle=mu;x.fillText(d.by,110,y+50);x.font='600 26px Manrope, system-ui, sans-serif';x.fillText(d.ref,110,y+92);
  x.font='500 34px "EB Garamond", Georgia, serif';x.fillStyle=ac;x.fillText('Seventy-Three',110,Hh-90);
  c.toBlob(async blob=>{if(!blob)return;try{if(await saveFile(blob,(d.file.replace(/[^\w]+/g,'-').toLowerCase()||'verse')+'.png'))toast('Image saved')}catch(e){toast('The image could not be saved')}},'image/png');
}
function speechText(key){
  if(/^v\d+$/.test(key))return T(+key.slice(1));
  if(/^q/.test(key)&&QBY[key.slice(1)])return QBY[key.slice(1)].t;
  const m=/^c([0-9A-Z]{3})(\d+)$/.exec(key);if(m){const b=BK[m[1]],c=+m[2],s=b.start+b.cum[c-1];let t='';for(let i=0;i<b.ch[c-1];i++)t+=T(s+i)+' ';return t}
  return '';
}
function stopSpeaking(){try{if(NATIVE)NATIVE.stopSpeaking();else if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}speaking=null}
window.__s73SpeechEnd=()=>{if(speaking){speaking=null;softRender()}};
function toggleSpeak(key){
  if(NATIVE){
    if(speaking===key){stopSpeaking();render();return}
    stopSpeaking();if(!NATIVE.canSpeak()){toast('Install an English voice in the phone settings to listen');return}
    speaking=key;NATIVE.speak(speechText(key));render();return}
  if(!('speechSynthesis' in window)){toast('Reading aloud is not available in this browser');return}
  if(speaking===key){stopSpeaking();render();return}
  stopSpeaking();const u=new SpeechSynthesisUtterance(speechText(key));u.rate=.95;u.lang='en-US';
  u.onend=()=>{if(speaking===key){speaking=null;softRender()}};u.onerror=u.onend;
  speaking=key;try{speechSynthesis.speak(u)}catch(e){speaking=null;toast('Reading aloud is not available here')}
  render();
}

/* ================= Events ================= */
let pending=false,ptrDown=false;
function flushPending(){if(pending&&!ptrDown&&!inField())render()}
document.addEventListener('pointerdown',()=>{ptrDown=true},true);
const ptrUp=()=>{ptrDown=false;if(pending)setTimeout(flushPending,0)};
document.addEventListener('pointerup',ptrUp,true);
document.addEventListener('pointercancel',ptrUp,true);
document.addEventListener('focusout',()=>{if(pending&&!ptrDown)setTimeout(flushPending,50)});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="link"][tabindex]')){e.preventDefault();e.target.click()}
});
document.addEventListener('click',async e=>{
  const a=e.target.closest('a.vref');if(a){e.preventDefault();e.stopPropagation();openVerse(+a.dataset.g);return}
  const t=e.target.closest('a,button,[data-verse],[data-trailpos],[data-quote],[data-go],[data-acct]');if(!t||!BIBLE||!S)return;
  const d=t.dataset;
  if(t.tagName==='A'){if(t.target==='_blank'||/^https?:/.test(t.getAttribute('href')||''))return;e.preventDefault()}
  if(d.tab){S.tab=d.tab;hist.length=0;V={name:'feed'};render();window.scrollTo(0,0);return}
  if(d.mix){S.mix=d.mix;render();return}
  if(d.go){const v={name:d.go};if(d.mtab)v.mtab=d.mtab;go(v);return}
  if(d.book){e.stopPropagation();go({name:'book',code:d.book});return}
  if(d.acct){e.stopPropagation();if(V.name==='acct'&&V.id===d.acct)return;if(ACC[d.acct])go({name:'acct',id:d.acct});return}
  if(d.like){e.stopPropagation();if(toggleLike(d.like))render();return}
  if(d.mark){e.stopPropagation();if(toggleBookmark(d.mark)){render();toast(M.me.bookmarks[d.mark]?'Saved to your bookmarks':'Removed from bookmarks')}return}
  if(d.follow){e.stopPropagation();if(toggleFollow(d.follow))render();return}
  if(d.img){e.stopPropagation();if(/^f:/.test(d.img))await loadFathers(bookOf(+d.img.split(':')[1]).code);saveImage(d.img);return}
  if(d.speak){toggleSpeak(d.speak);return}
  if(d.xsort){S.xsort=d.xsort;V.more=10;render();return}
  if(d.xfilt){S.xfilt=d.xfilt;V.more=10;render();return}
  if(d.ffilt){S.ffilt=d.ffilt;V.fmore=15;V.ffocus=null;render();return}
  if(d.moreref){V.more=(V.more||10)+10;render();return}
  if(d.fmore){V.fmore=(V.fmore||15)+15;render();return}
  if(d.cmore){V.cmore=(V.cmore||30)+30;render();return}
  if(d.smore){V.smore=(V.smore||(V.name==='today'?12:60))+60;render();return}
  if(d.mmore){V.mmore=true;render();return}
  if(d.expand){expanded[d.expand]=!expanded[d.expand];render();return}
  if(d.orig){V.orig=!V.orig;render();return}
  if(d.alltrail){V.allTrail=true;render();return}
  if(d.ptab){V.ptab=d.ptab;V.focus=null;render();return}
  if(d.btab){V.btab=d.btab;render();return}
  if(d.atab){V.atab=d.atab;render();return}
  if(d.mtab){V.mtab=d.mtab;render();return}
  if(d.stype!=null){V.st=d.stype;V.smore=60;render();return}
  if(d.bookmore){V.page=(V.page||0)+1;render();return}
  if(d.day){V.date=d.day;V.mmore=false;V.smore=12;render();window.scrollTo(0,0);return}
  if(d.calsel){S.cal=d.calsel;loadNat(S.cal);render();return}
  if(d.dlall){saveAllOffline();return}
  if(d.export){exportBackup();return}
  if(d.planstart){M.me.plan={start:todayKey(),done:{}};saveMe();render();toast('Plan started: day 1 is today');return}
  if(d.planreset){M.me.plan=null;saveMe();render();return}
  if(d.plandone){const n=+d.plandone;M.me.plan.done=M.me.plan.done||{};if(M.me.plan.done[n])delete M.me.plan.done[n];else M.me.plan.done[n]=1;saveMe();render();return}
  if(d.editnote){V.editNote=true;render();const n=$('#note-text');if(n)n.focus();return}
  if(d.savenote){const g=+d.savenote,v=($('#note-text')||{}).value||'';if(v.trim())M.me.notes['v'+g]=v.trim();else delete M.me.notes['v'+g];V.editNote=false;saveMe();render();toast(v.trim()?'Note saved':'Note removed');return}
  if(d.read){go({name:'chapter',code:d.read,c:+d.c,hl:d.hl!=null?+d.hl:null});return}
  if(d.copy){const g=+d.copy,txt=`“${T(g)}” (${refLabel(g)}, Douay-Rheims)`;try{if(NATIVE)NATIVE.copy(txt);else await navigator.clipboard.writeText(txt);toast('Copied')}catch(err){toast('Copy is not available here')}return}
  if(d.q){V.q=d.q;const q=$('#q');if(q)q.value=d.q;searchResults();return}
  if(t.id==='back'){goBack();return}
  if(d.trailpos!=null){const pos=+d.trailpos,trail=V.trail||[];go({name:'verse',g:trail[pos],trail:trail.slice(0,pos),ptab:'scripture'});return}
  if(d.quote){go({name:'quote',id:d.quote});return}
  if(d.verse!=null&&d.verse!==''){
    const g=+d.verse;
    if(d.from!=null&&V.name==='verse'){const base=[...(V.trail||[]),+d.from];if(d.via!=null)base.push(+d.via);openVerse(g,base)}
    else openVerse(g,[],d.ptabgo,d.ffocus);
    return}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){V.q=el.value;clearTimeout(window._sq);window._sq=setTimeout(searchResults,180)}
  if(el.id==='sq'){V.sq=el.value;V.smore=60;clearTimeout(window._ss);window._ss=setTimeout(()=>{const f=plain(V.sq||''),t=V.st||'';const list=SAINTS.filter(s=>(!t||s.t===t)&&(!f||plain(s.n).includes(f)||plain(s.bio||'').includes(f)||(s.p||[]).some(p=>plain(p).includes(f)))).sort((a,b)=>(b.grc?1:0)-(a.grc?1:0)||a.n.localeCompare(b.n));const box=$('#saintlist');if(box)box.innerHTML=saintRows(list.slice(0,60),list.length)},150)}
});
document.addEventListener('change',e=>{if(e.target.id==='importfile'){importBackup(e.target.files&&e.target.files[0]);e.target.value=''}});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='searchform'){const r=parseRef(V.q||'');if(r&&r.g>=0&&r.v)openVerse(r.g);else if(r&&r.c&&!r.bad)go({name:'chapter',code:r.code,c:r.c});else searchResults()}
});

/* Pull to refresh and endless scroll on the feeds */
let pulling=0,refreshing=false,touchY=null,wheelAcc=0,wheelT=0;
function showPull(px){const el=$('#ptr');if(!el)return;el.style.height=Math.min(px,70)+'px';el.textContent=px>=60?'Release to load new posts':'Pull to load new posts'}
function doRefresh(){
  if(refreshing||V.name!=='feed'||!S)return;refreshing=true;
  const el=$('#ptr');if(el){el.style.height='44px';el.innerHTML='<span class="dots"><i></i><i></i><i></i></span> Loading new posts'}
  setTimeout(()=>{try{const n=S.tab==='following'?0:loadNewOnTop();render();window.scrollTo(0,0);toast(n?n+' new posts at the top':'Up to date')}finally{refreshing=false}},550);
}
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2200)}
window.addEventListener('touchstart',e=>{touchY=S&&window.scrollY<=0&&V.name==='feed'?e.touches[0].clientY:null},{passive:true});
window.addEventListener('touchmove',e=>{if(touchY==null||refreshing)return;pulling=e.touches[0].clientY-touchY;if(pulling>0)showPull(pulling)},{passive:true});
window.addEventListener('touchend',()=>{if(touchY==null)return;if(pulling>=60)doRefresh();else showPull(0);touchY=null;pulling=0});
window.addEventListener('wheel',e=>{
  if(!S||V.name!=='feed'||window.scrollY>0||e.deltaY>=0||refreshing){wheelAcc=0;return}
  const now=Date.now();if(now-wheelT>500)wheelAcc=0;wheelT=now;
  wheelAcc+=-e.deltaY;showPull(wheelAcc/4);
  clearTimeout(window._wh);window._wh=setTimeout(()=>{if(!refreshing)showPull(0);wheelAcc=0},500);
  if(wheelAcc>=260){wheelAcc=0;doRefresh()}
},{passive:true});
let loadingMore=false;
window.addEventListener('scroll',()=>{
  if(loadingMore||!S||V.name!=='feed'||S.tab==='following')return;
  if(window.innerHeight+window.scrollY>document.documentElement.scrollHeight-500){loadingMore=true;try{if(loadMoreBelow())render()}finally{loadingMore=false}}
},{passive:true});

/* ================= Boot ================= */
const getJSON=p=>fetch(p+'?v='+DV).then(r=>{if(!r.ok)throw new Error(p);return r.json()});
async function boot(){
  try{BIBLE=await getJSON('data/bible.json')}
  catch(e){$('#main').innerHTML='<div class="splash"><div><h1>Seventy-Three</h1><p>The Bible text could not be loaded. Check your connection and reload the page.</p></div></div>';return}
  indexBible();
  S=loadPrefs()||freshPrefs();loadLocal();
  if(!S.feed.length)S.feed=[['JOH',1,1],['LUK',1,28],['PSA',22,1],['ISA',53,5],['WIS',3,1],['MAT',16,18]].map(r=>idx(...r)).filter(g=>g>=0).map(g=>({g,why:''}));
  if(S.feed.length<12)S.feed=S.feed.concat(pickMany(12-S.feed.length));
  render();renderRail();startOffline();loadNat(S.cal);
  const later=(p,fn)=>getJSON(p).then(d=>{fn(d);DATA[p.slice(5,-5)]='ok';softRender()}).catch(()=>{DATA[p.slice(5,-5)]='missing';softRender()});
  later('data/saints.json',d=>{indexSaints(d);renderRail()});
  later('data/quotes.json',d=>{indexQuotes(d);if(S.qfeed.length<10)S.qfeed=S.qfeed.concat(pickQuotes(10-S.qfeed.length))});
  later('data/calendar.json',d=>{CAL=d;renderRail()});
  later('data/martyrology.json',d=>{MART=d});
  later('data/fathers/_counts.json',d=>{FCOUNT=d});
  later('data/fathers/_authors.json',d=>{FAUTH=d});
  later('data/credits.json',d=>{CREDITS=d});
  getJSON('data/xrefs.json').then(d=>{XR=d.r;buildScores();softRender()}).catch(()=>{XR_FAILED=true;XR=[];softRender()});
}
boot();
